services:
  db:
    image: postgres:16-alpine
    container_name: mmc-db
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: mmc
      POSTGRES_USER: mmc
      POSTGRES_PASSWORD: mmc_dev_2025
    volumes:
      - mmc_pgdata:/var/lib/postgresql/data

volumes:
  mmc_pgdata:
